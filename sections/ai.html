<!-- GREF AI Research - Full Content -->
<div id="ai-research-container">

<style>
:root {
  --bg: #ffffff;
  --fg: #111111;
  --fg-secondary: #555555;
  --fg-muted: #999999;
  --fg-unconfirmed: #b0b0b0;
  --border: #e0e0e0;
  --border-light: #f0f0f0;
  --accent: #111111;
  --accent-light: #f5f5f5;
  --tag-env: #1a1a1a;
  --tag-growth: #444444;
  --tag-vision: #666666;
  --tag-timeseries: #333333;
  --tag-sim: #555555;
  --tag-platform: #222222;
  --tag-ai: #777777;
  --card-hover: 0 2px 20px rgba(0,0,0,0.06);
  --radius: 2px;
  --font-sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-mono: "SF Mono", "Fira Code", "Fira Mono", "Roboto Mono", monospace;
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

button, input, select, textarea { font-family: var(--font-sans); }

html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--fg);
  line-height: 1.6;
  font-size: 14px;
  letter-spacing: -0.01em;
}

/* ── HEADER ── */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}

.header-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 20px 32px 0;
}

.header-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 16px;
}

.logo {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.logo span { font-weight: 300; color: var(--fg-muted); margin-left: 8px; letter-spacing: 0.04em; }

.header-sub {
  font-size: 12px;
  color: var(--fg-muted);
  letter-spacing: 0.02em;
}

/* ── TABS ── */
.tabs {
  display: flex;
  gap: 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.tabs::-webkit-scrollbar { display: none; }

.tab-btn {
  background: none;
  border: none;
  padding: 10px 20px;
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 500;
  color: var(--fg-muted);
  cursor: pointer;
  white-space: nowrap;
  border-bottom: 2px solid transparent;
  transition: all var(--transition);
  letter-spacing: 0.02em;
}

.tab-btn:hover { color: var(--fg); }
.tab-btn.active { color: var(--fg); border-bottom-color: var(--fg); font-weight: 600; }

/* ── MAIN ── */
.main {
  max-width: 1280px;
  margin: 0 auto;
  padding: 32px;
  min-height: calc(100vh - 120px);
}

.tab-panel { display: none; animation: fadeUp 0.3s ease; }
.tab-panel.active { display: block; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── SECTION HEADERS ── */
.section-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--fg-muted);
  margin-bottom: 20px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

/* ── FILTER BUTTONS ── */
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 24px;
}

.filter-btn {
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 5px 14px;
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 500;
  color: var(--fg-secondary);
  cursor: pointer;
  border-radius: var(--radius);
  transition: all var(--transition);
  letter-spacing: 0.02em;
}

.filter-btn:hover { border-color: var(--fg); color: var(--fg); }
.filter-btn.active { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* ── TABLE ── */
.table-wrap { overflow-x: auto; margin-bottom: 32px; }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

thead th {
  text-align: left;
  padding: 10px 14px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--fg-muted);
  border-bottom: 2px solid var(--fg);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  transition: color var(--transition);
}

thead th:hover { color: var(--fg); }
thead th .sort-arrow { font-size: 9px; margin-left: 4px; opacity: 0.4; }
thead th.sorted .sort-arrow { opacity: 1; }

tbody tr {
  border-bottom: 1px solid var(--border-light);
  transition: background var(--transition);
  cursor: pointer;
}

tbody tr:hover { background: var(--accent-light); }
tbody tr.hidden { display: none; }

tbody td {
  padding: 10px 14px;
  vertical-align: middle;
}

/* ── BADGES ── */
.badge {
  display: inline-block;
  padding: 2px 8px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.04em;
  border-radius: 1px;
  color: #fff;
  white-space: nowrap;
}

.badge-env { background: var(--tag-env); }
.badge-growth { background: var(--tag-growth); }
.badge-vision { background: var(--tag-vision); }
.badge-timeseries { background: var(--tag-timeseries); }
.badge-sim { background: var(--tag-sim); }
.badge-platform { background: var(--tag-platform); }
.badge-ai { background: var(--tag-ai); }

.badge-compat {
  background: transparent;
  color: var(--fg);
  border: 1px solid var(--border);
  font-weight: 500;
}
.badge-compat.high { border-color: var(--fg); color: var(--fg); }
.badge-compat.partial { border-color: var(--fg-muted); color: var(--fg-muted); }
.badge-compat.low { border-color: var(--border); color: var(--fg-unconfirmed); }
.badge-compat.none { border-color: var(--border); color: var(--fg-unconfirmed); }

.unconfirmed { color: var(--fg-unconfirmed); font-style: italic; }

.opensource-yes { font-weight: 600; }
.opensource-no { color: var(--fg-muted); }

/* ── CARDS ── */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 16px;
  margin-bottom: 40px;
}

.card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: visible;
  transition: box-shadow var(--transition), border-color var(--transition);
}

.card:hover { box-shadow: var(--card-hover); border-color: #ccc; }

.card-header {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border-light);
}

.card-header .badge { margin-bottom: 8px; }

.card-model-name {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 2px;
}

.card-meta {
  font-size: 12px;
  color: var(--fg-muted);
}

.card-section {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border-light);
}

.card-section:last-child { border-bottom: none; }

.card-section-title {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-muted);
  margin-bottom: 8px;
}

.card-section p, .card-section li {
  font-size: 13px;
  line-height: 1.6;
  color: var(--fg-secondary);
}

.card-section ul {
  list-style: none;
  padding: 0;
}

.card-section ul li::before {
  content: "·";
  margin-right: 8px;
  color: var(--fg-muted);
  font-weight: 700;
}

.card-links {
  display: flex;
  gap: 12px;
  padding: 14px 20px;
}

.card-links a {
  font-size: 11px;
  font-weight: 600;
  color: var(--fg);
  text-decoration: none;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  border-bottom: 1px solid var(--fg);
  padding-bottom: 1px;
  transition: opacity var(--transition);
}

.card-links a:hover { opacity: 0.6; }
.card-links a.disabled { color: var(--fg-unconfirmed); border-color: var(--fg-unconfirmed); pointer-events: none; }

/* ── CATEGORY DIVIDER ── */
.category-group { margin-bottom: 48px; }

.category-header {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 20px;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--fg);
}

/* ── AGC SECTION ── */
.agc-hero {
  padding: 40px 0;
  margin-bottom: 32px;
  border-bottom: 1px solid var(--border);
}

.agc-hero h2 {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.03em;
  margin-bottom: 8px;
}

.agc-hero .subtitle {
  font-size: 14px;
  color: var(--fg-muted);
  margin-bottom: 20px;
}

.agc-stats {
  display: flex;
  gap: 40px;
  flex-wrap: wrap;
}

.agc-stat {
  display: flex;
  flex-direction: column;
}

.agc-stat-value {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.agc-stat-label {
  font-size: 11px;
  color: var(--fg-muted);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.agc-section { margin-bottom: 40px; }

.agc-section h3 {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin-bottom: 16px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}

.team-card {
  border: 1px solid var(--border);
  padding: 20px;
  margin-bottom: 12px;
  border-radius: var(--radius);
  transition: box-shadow var(--transition);
}

.team-card:hover { box-shadow: var(--card-hover); }

.team-card .rank {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--fg-muted);
  margin-bottom: 4px;
}

.team-card .rank.winner { color: var(--fg); }

.team-card .team-name {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 4px;
}

.team-card .team-org {
  font-size: 12px;
  color: var(--fg-muted);
  margin-bottom: 12px;
}

.team-card .team-detail {
  font-size: 13px;
  color: var(--fg-secondary);
  line-height: 1.6;
}

.key-insight {
  background: var(--accent-light);
  padding: 16px 20px;
  margin-bottom: 12px;
  border-left: 3px solid var(--fg);
  font-size: 13px;
  line-height: 1.7;
}

.sensor-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
  margin-top: 16px;
}

.sensor-group {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
}

.sensor-group h4 {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--fg-muted);
  margin-bottom: 12px;
}

.sensor-item {
  display: flex;
  justify-content: space-between;
  padding: 4px 0;
  font-size: 12px;
  border-bottom: 1px solid var(--border-light);
}

.sensor-item:last-child { border-bottom: none; }
.sensor-item .unit { color: var(--fg-muted); font-family: var(--font-mono); font-size: 11px; }

/* ── IO CARDS ── */
.io-card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 24px;
  overflow: visible;
}

.io-card-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: background var(--transition);
}

.io-card-header:hover { background: var(--accent-light); }

.io-card-header h3 {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.io-card-header .toggle {
  font-size: 18px;
  color: var(--fg-muted);
  transition: transform var(--transition);
}

.io-card.open .io-card-header .toggle { transform: rotate(45deg); }

.io-card-body {
  display: none;
  padding: 0;
}

.io-card.open .io-card-body { display: block; }

.io-subsection {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-light);
}

.io-subsection:last-child { border-bottom: none; }

.io-subsection h4 {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--fg-muted);
  margin-bottom: 10px;
}

.io-table {
  width: 100%;
  font-size: 12px;
  border-collapse: collapse;
}

.io-table th {
  text-align: left;
  padding: 6px 10px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--fg-muted);
  border-bottom: 1px solid var(--border);
  cursor: default;
}

.io-table td {
  padding: 6px 10px;
  border-bottom: 1px solid var(--border-light);
  vertical-align: top;
}

.io-table .var-name { font-family: var(--font-mono); font-size: 11px; font-weight: 500; }
.io-table .check-yes { color: var(--fg); font-weight: 600; }
.io-table .check-partial { color: var(--fg-muted); }
.io-table .check-no { color: var(--fg-unconfirmed); }

.env-info {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.env-info-item {
  font-size: 12px;
}

.env-info-item .label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--fg-muted);
}

.agc-compat-badge {
  display: inline-block;
  padding: 3px 10px;
  font-size: 11px;
  font-weight: 600;
  border-radius: var(--radius);
  margin-top: 8px;
}

.compat-high { background: var(--fg); color: var(--bg); }
.compat-partial { background: var(--accent-light); color: var(--fg); border: 1px solid var(--border); }
.compat-low { background: transparent; color: var(--fg-muted); border: 1px solid var(--border); }
.compat-none { background: transparent; color: var(--fg-unconfirmed); border: 1px solid var(--border-light); }

/* ── FOOTER ── */
.footer {
  max-width: 1280px;
  margin: 0 auto;
  padding: 32px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--fg-muted);
  display: flex;
  justify-content: space-between;
  letter-spacing: 0.02em;
}

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  .header-inner, .main, .footer { padding-left: 16px; padding-right: 16px; }
  .cards-grid { grid-template-columns: 1fr; }
  .sensor-grid { grid-template-columns: 1fr; }
  .agc-stats { gap: 24px; }
  .env-info { grid-template-columns: 1fr; }
  .tab-btn { padding: 10px 14px; font-size: 11px; }
  .agc-hero h2 { font-size: 22px; }
  .footer { flex-direction: column; gap: 8px; }
}

/* ── PRINT ── */
@media print {
  .header { position: static; backdrop-filter: none; }
  .tabs { display: none; }
  .tab-panel { display: block !important; page-break-inside: avoid; margin-bottom: 32px; }
  .tab-panel::before { content: attr(data-title); display: block; font-size: 20px; font-weight: 700; margin-bottom: 16px; border-bottom: 2px solid #000; padding-bottom: 8px; }
  .card:hover, .team-card:hover, .io-card-header:hover { box-shadow: none; background: none; }
  .io-card-body { display: block !important; }
  .footer { border-top: 1px solid #000; }
  body { font-size: 11px; }
}


/* ── Phase Cards ── */
.phase-cards-container { padding: 0; }

.phase-summary {
  display: flex;
  align-items: baseline;
  gap: 12px;
  padding: 14px 18px;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.phase-summary-period {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--fg);
  white-space: nowrap;
  padding: 2px 8px;
  border: 1px solid var(--fg);
  border-radius: var(--radius);
}
.phase-summary-goal {
  font-size: 13px;
  color: var(--fg-secondary);
  line-height: 1.5;
}

.phase-card { margin-bottom: 0; }

.phase-card-header {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  padding: 14px 18px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 8px;
  transition: background var(--transition), box-shadow var(--transition);
  background: var(--bg);
  user-select: none;
}
.phase-card-header:hover {
  background: var(--accent-light);
}

.phase-card-body {
  display: none;
  padding: 0 18px 18px;
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 var(--radius) var(--radius);
  margin-top: -9px;
  margin-bottom: 8px;
  background: var(--bg);
}
.phase-card.phase-card-open .phase-card-body {
  display: block;
}
.phase-card.phase-card-open .phase-card-header {
  border-radius: var(--radius) var(--radius) 0 0;
  margin-bottom: 0;
  border-bottom: none;
}
.phase-card.phase-card-open .phase-card-toggle {
  transform: rotate(45deg);
}

.phase-card-num {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--fg-muted);
  min-width: 24px;
}
.phase-card-title {
  font-size: 14px;
  font-weight: 600;
  flex: 1;
  color: var(--fg);
}
.phase-card-tag {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 1px;
  font-weight: 600;
  letter-spacing: 0.04em;
  white-space: nowrap;
}
.phase-card-tag.tag-required {
  background: var(--fg);
  color: var(--bg);
}
.phase-card-tag.tag-optional {
  background: var(--bg);
  color: var(--fg);
  border: 1px solid var(--fg);
}
.phase-card-status {
  font-size: 14px;
  line-height: 1;
}
.phase-card-toggle {
  font-size: 16px;
  font-weight: 300;
  color: var(--fg-muted);
  transition: transform 0.2s ease;
  line-height: 1;
}

.phase-card-body h4 {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--fg-muted);
  margin: 14px 0 6px;
}
.phase-card-body h4:first-child {
  margin-top: 16px;
}
.phase-card-body p {
  font-size: 13px;
  line-height: 1.7;
  color: var(--fg-secondary);
  margin: 0;
}

/* ── Print ── */
@media print {
  .phase-card-body { display: block !important; }
  .phase-card-toggle { display: none; }
  .phase-card-header { cursor: default; }
  .phase-card { break-inside: avoid; }
}

/* ── Responsive ── */
@media (max-width: 640px) {
  .phase-card-header { padding: 12px 14px; gap: 8px; }
  .phase-card-body { padding: 0 14px 14px; }
  .phase-card-title { font-size: 13px; }
  .phase-summary { flex-direction: column; gap: 6px; padding: 12px 14px; }
}



/* ── 적용 가능성 탭 ── */
.apply-wrap { max-width: 1100px; margin: 0 auto; }
.apply-intro {
  font-size: .93rem; line-height: 1.7; color: var(--fg-secondary);
  margin-bottom: 2rem; padding-bottom: 1rem;
  border-bottom: 1px solid var(--border-light);
}

/* 영역 카드 */
.apply-area {
  margin-bottom: 2.5rem;
}
.apply-area-header {
  font-size: 1.1rem; font-weight: 700; color: var(--fg);
  padding: .6rem 0; margin-bottom: .8rem;
  border-bottom: 2px solid var(--fg);
  display: flex; align-items: center; gap: .6rem;
}
.apply-area-icon {
  font-size: 1rem; opacity: .7;
}
.apply-table-wrap {
  overflow-x: auto; margin-bottom: .5rem;
}
.apply-table {
  width: 100%; border-collapse: collapse; font-size: .88rem;
}
.apply-table thead th {
  text-align: left; padding: .5rem .6rem;
  font-weight: 600; font-size: .8rem;
  color: var(--fg-secondary);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.apply-table tbody tr {
  cursor: pointer; transition: background .15s;
}
.apply-table tbody tr:hover {
  background: var(--accent-light);
}
.apply-table tbody td {
  padding: .55rem .6rem;
  border-bottom: 1px solid var(--border-light);
  vertical-align: top;
}
.apply-table .apply-status-yes { color: #2a7d2a; font-weight: 600; }
.apply-table .apply-status-warn { color: #b8860b; font-weight: 600; }
.apply-table .apply-status-no { color: #c0392b; font-weight: 600; }

/* 아코디언 상세 */
.apply-detail-row td {
  padding: 0 !important; border-bottom: 1px solid var(--border-light);
}
.apply-detail-content {
  max-height: 0; overflow: hidden; transition: max-height .3s ease, padding .3s ease;
  padding: 0 1rem; font-size: .85rem; line-height: 1.65; color: var(--fg-secondary);
  background: var(--accent-light);
}
.apply-detail-content.open {

<script>
(function(){
  var panels = [
    {id:'panel-proj-overview', file:'sections/ai/overview.html'},
    {id:'panel-proj-analysis', file:'sections/ai/analysis.html'},
    {id:'panel-proj-phase0', file:'sections/ai/phase0.html'},
    {id:'panel-proj-phase1', file:'sections/ai/phase1.html'},
    {id:'panel-proj-phase2', file:'sections/ai/phase2.html'},
    {id:'panel-proj-phase3', file:'sections/ai/phase3.html'},
    {id:'panel-proj-glossary', file:'sections/ai/glossary.html'}
  ];
  var loaded = 0;
  panels.forEach(function(p){
    fetch(p.file + '?v=' + Date.now())
      .then(function(r){ return r.text(); })
      .then(function(html){
        var el = document.getElementById(p.id);
        if(el) el.innerHTML = html;
        // Execute any inline scripts in the loaded HTML
        var scripts = el.querySelectorAll('script');
        scripts.forEach(function(oldScript){
          var newScript = document.createElement('script');
          if(oldScript.src){ newScript.src = oldScript.src; }
          else { newScript.textContent = oldScript.textContent; }
          oldScript.parentNode.replaceChild(newScript, oldScript);
        });
        loaded++;
        if(loaded === panels.length){
          // All panels loaded — initialize scripts
          document.dispatchEvent(new Event('panels-loaded'));
        }
      });
  });
})();
</script>

<script>
document.addEventListener('panels-loaded', function(){

// Category filter (Tab 1)
document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const filter = btn.dataset.filter;
    document.querySelectorAll('#overview-table tbody tr').forEach(row => {
      if (filter === 'all' || row.dataset.category === filter) {
        row.classList.remove('hidden');
      } else {
        row.classList.add('hidden');
      }
    });
  });
});

// IO filter (Tab 4)
document.querySelectorAll('.filter-btn[data-filter-io]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn[data-filter-io]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const filter = btn.dataset.filterIo;
    document.querySelectorAll('.io-card').forEach(card => {
      if (filter === 'all') {
        card.style.display = '';
      } else if (filter === 'high') {
        card.style.display = card.dataset.compat === 'high' ? '' : 'none';
      }
    });
  });
});

// Table sorting
document.querySelectorAll('#overview-table thead th[data-sort]').forEach(th => {
  let asc = true;
  th.addEventListener('click', () => {
    const key = th.dataset.sort;
    const tbody = document.querySelector('#overview-table tbody');
    const rows = Array.from(tbody.querySelectorAll('tr'));
    document.querySelectorAll('#overview-table thead th').forEach(h => h.classList.remove('sorted'));
    th.classList.add('sorted');
    rows.sort((a, b) => {
      let va = (a.dataset[key] || a.querySelector('td')?.textContent || '').toLowerCase();
      let vb = (b.dataset[key] || b.querySelector('td')?.textContent || '').toLowerCase();
      if (key === 'year') { va = parseInt(va) || 0; vb = parseInt(vb) || 0; return asc ? va - vb : vb - va; }
      return asc ? va.localeCompare(vb, 'ko') : vb.localeCompare(va, 'ko');
    });
    asc = !asc;
    th.querySelector('.sort-arrow').textContent = asc ? '\u25B2' : '\u25BC';
    rows.forEach(r => tbody.appendChild(r));
  });
});

// Row click → switch to detail tab (using proj sub-tab system)
document.querySelectorAll('#overview-table tbody tr').forEach(row => {
  row.addEventListener('click', () => {
    // Switch Phase 0 sub-tab to "detail"
    var detailBtn = document.querySelector('#phase0-sub-tabs .tab-btn[data-tab="detail"]');
    if (detailBtn && window.projSubTabSwitch) {
      window.projSubTabSwitch(detailBtn);
    }
    const name = row.dataset.name;
    const cards = document.querySelectorAll('.card-model-name');
    for (const card of cards) {
      if (card.textContent.includes(name)) {
        setTimeout(() => card.closest('.card').scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
        break;
      }
    }
  });
});

}); // end panels-loaded
</script>

     ────────────────────────────────────────────── */
  function projTopTabSwitch(targetTab) {
    // 최상위 탭 버튼 활성화
    var topBtns = document.querySelectorAll('.proj-top-tab');
    topBtns.forEach(function(btn) {

    var subTabs = document.getElementById('phase0-sub-tabs');
    if (subTabs) {
      subTabs.style.display = (targetTab === 'phase0') ? 'flex' : 'none';
    }

    // 현황 분석 하위 탭 표시/숨기기
    var analysisSubTabs = document.getElementById('analysis-sub-tabs');
    if (analysisSubTabs) {
      analysisSubTabs.style.display = (targetTab === 'analysis') ? 'flex' : 'none';
    }

    // 프로젝트 패널 전환
    var panels = document.querySelectorAll('.proj-panel');
    panels.forEach(function(p) { p.classList.remove('active'); });

    if (targetTab === 'overview') {
      var el = document.getElementById('panel-proj-overview');
      if (el) el.classList.add('active');
    } else if (targetTab === 'analysis') {
      var analysisWrapper = document.getElementById('panel-proj-analysis');
      if (analysisWrapper) analysisWrapper.classList.add('active');
      analysisSubTabSwitch(null);
    } else if (targetTab === 'phase0') {
      // Phase 0: 기존 tab-panel들을 표시하되, 하위 탭의 active 상태에 따라
      // 기존 main 영역의 패널을 보여주는 로직
      // 기존 탭 시스템이 이미 처리하므로, phase0 래퍼만 활성화
      var phase0Wrapper = document.getElementById('panel-proj-phase0');
      if (phase0Wrapper) phase0Wrapper.classList.add('active');
      // 하위 탭 중 첫 번째 활성화된 것에 맞춰 기존 패널 표시
      projSubTabSwitch(null);
    } else if (targetTab === 'phase1') {
      var el = document.getElementById('panel-proj-phase1');
      if (el) el.classList.add('active');
    } else if (targetTab === 'phase2') {
      var el = document.getElementById('panel-proj-phase2');
      if (el) el.classList.add('active');
    } else if (targetTab === 'phase3') {
      var el = document.getElementById('panel-proj-phase3');
      if (el) el.classList.add('active');
    } else if (targetTab === 'glossary') {
      var el = document.getElementById('panel-proj-glossary');
      if (el) el.classList.add('active');
    }
  }

  /* ──────────────────────────────────────────────
     Phase 0 하위 탭 전환 (projSubTabSwitch)
     기존 .tab-btn / .tab-panel 시스템과 연동
     ────────────────────────────────────────────── */
  function projSubTabSwitch(clickedBtn) {
    var subTabsNav = document.getElementById('phase0-sub-tabs');
    if (!subTabsNav) return;

    var btns = subTabsNav.querySelectorAll('.tab-btn');

    // 클릭된 버튼이 있으면 활성화 전환
    if (clickedBtn) {
      btns.forEach(function(b) { b.classList.remove('active'); });
      clickedBtn.classList.add('active');
    }

    // 현재 활성 하위 탭
    var activeBtn = subTabsNav.querySelector('.tab-btn.active');
    if (!activeBtn) return;

    var tabId = activeBtn.getAttribute('data-tab');

    // Phase 0 래퍼 내 tab-panel만 숨기기
    var wrapper = document.getElementById('panel-proj-phase0');
    if (!wrapper) return;
    var existingPanels = wrapper.querySelectorAll('.tab-panel');
    existingPanels.forEach(function(p) { p.classList.remove('active'); });

    // 대상 패널 활성화
    var targetPanel = document.getElementById('panel-' + tabId);
    if (targetPanel) targetPanel.classList.add('active');
  }

  /* ──────────────────────────────────────────────
     현황 분석 하위 탭 전환 (analysisSubTabSwitch)
     ────────────────────────────────────────────── */
  function analysisSubTabSwitch(clickedBtn) {
    var subTabsNav = document.getElementById('analysis-sub-tabs');
    if (!subTabsNav) return;

    var btns = subTabsNav.querySelectorAll('.tab-btn');

    if (clickedBtn) {
      btns.forEach(function(b) { b.classList.remove('active'); });
      clickedBtn.classList.add('active');
    }

    var activeBtn = subTabsNav.querySelector('.tab-btn.active');
    if (!activeBtn) return;

    var tabId = activeBtn.getAttribute('data-tab');

    // 현황 분석 래퍼 내 tab-panel 전환
    var wrapper = document.getElementById('panel-proj-analysis');
    if (!wrapper) return;
    var panels = wrapper.querySelectorAll('.tab-panel');
    panels.forEach(function(p) { p.classList.remove('active'); });

    var targetPanel = document.getElementById('panel-' + tabId);
    if (targetPanel) targetPanel.classList.add('active');
  }

  /* ── 이벤트 바인딩: 최상위 탭 ── */
  document.addEventListener('click', function(e) {
    var topTab = e.target.closest('.proj-top-tab');
    if (topTab) {
      e.preventDefault();
      var target = topTab.getAttribute('data-proj-tab');
      projTopTabSwitch(target);
      return;
    }

    // 현황 분석 하위 탭
    var analysisSubNav = document.getElementById('analysis-sub-tabs');
    if (analysisSubNav && analysisSubNav.contains(e.target)) {
      var analysisBtn = e.target.closest('.tab-btn');
      if (analysisBtn) {
        e.preventDefault();
        analysisSubTabSwitch(analysisBtn);
        return;
      }
    }

    // Phase 0 하위 탭
    var subNav = document.getElementById('phase0-sub-tabs');
    if (subNav && subNav.contains(e.target)) {
      var subBtn = e.target.closest('.tab-btn');
      if (subBtn) {
        e.preventDefault();
        projSubTabSwitch(subBtn);
      }
    }
  });

  // 전역에 노출 (통합 스크립트에서 접근 가능하도록)
  window.projTopTabSwitch = projTopTabSwitch;
  window.projSubTabSwitch = projSubTabSwitch;
  window.analysisSubTabSwitch = analysisSubTabSwitch;

})();
</script>

  // Build regex that matches whole terms (case-sensitive for abbreviations)
  var escapedTerms = terms.map(function(t){ return t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); });
  var regex = new RegExp('\\b(' + escapedTerms.join('|') + ')\\b', 'g');

  // Walk text nodes and wrap matches
  function walkAndReplace(root) {
    if (!root) return;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);

    nodes.forEach(function(textNode) {
      var parent = textNode.parentNode;
      if (!parent) return;
      var tag = parent.tagName;
      // Skip script, style, already-wrapped, inputs, code
      if (/^(SCRIPT|STYLE|CODE|PRE|TEXTAREA|INPUT|SELECT)$/i.test(tag)) return;
      if (parent.classList && parent.classList.contains('gt')) return;
      if (parent.closest && parent.closest('.gt')) return;
      // Skip glossary section itself
      if (parent.closest && parent.closest('#panel-proj-glossary')) return;
      // Skip header
      if (parent.closest && parent.closest('header')) return;

      var text = textNode.nodeValue;
      if (!regex.test(text)) return;
      regex.lastIndex = 0;

      var frag = document.createDocumentFragment();
      var lastIdx = 0;
      var match;
      var replaced = false;
      regex.lastIndex = 0;
      while ((match = regex.exec(text)) !== null) {
        var term = match[1];
        if (!glossary[term]) continue;
        replaced = true;
        // Text before match
        if (match.index > lastIdx) {
          frag.appendChild(document.createTextNode(text.slice(lastIdx, match.index)));
        }
        // Wrapped term
        var span = document.createElement('span');
        span.className = 'gt';
        span.textContent = term;
        var tip = document.createElement('span');
        tip.className = 'gt-tip';
        tip.textContent = glossary[term];
        span.appendChild(tip);
        frag.appendChild(span);
        lastIdx = match.index + match[0].length;
      }
      if (replaced) {
        if (lastIdx < text.length) {
          frag.appendChild(document.createTextNode(text.slice(lastIdx)));
        }
        parent.replaceChild(frag, textNode);
      }
    });
  }

  // Run after DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function(){ walkAndReplace(document.querySelector('.main')); });
  } else {
    walkAndReplace(document.querySelector('.main'));
  }
})();
}); // end panels-loaded for glossary tooltip
</script>

  // ── 모델 셀렉트 업데이트 ──
  var areaSelect = document.getElementById('apply-area-select');
  var modelSelect = document.getElementById('apply-model-select');

  function updateModelSelect(){
    if(!areaSelect || !modelSelect) return;
    var area = areaSelect.value;
    var models = simData[area];
    modelSelect.innerHTML = '';
    if(!models) return;
    Object.keys(models).forEach(function(key){
      var opt = document.createElement('option');
      opt.value = key;
      opt.textContent = models[key].name;
      modelSelect.appendChild(opt);
    });
  }

  if(areaSelect){
    areaSelect.addEventListener('change', function(){
      updateModelSelect();
      document.getElementById('apply-sim-result').innerHTML = '';
    });
    updateModelSelect();
  }

  // ── 시뮬레이션 실행 ──
  window.runApplySim = function(){
    var area = areaSelect ? areaSelect.value : '';
    var modelKey = modelSelect ? modelSelect.value : '';
    var resultDiv = document.getElementById('apply-sim-result');
    if(!resultDiv) return;

    var models = simData[area];
    if(!models || !models[modelKey]){
      resultDiv.innerHTML = '<p style="color:var(--fg-muted)">모델을 선택해 주세요.</p>';
      return;
    }

    var m = models[modelKey];
    var statusClass = m.status === 'yes' ? 'apply-status-yes' : m.status === 'warn' ? 'apply-status-warn' : 'apply-status-no';
    var statusIcon = m.status === 'yes' ? '\u2705' : m.status === 'warn' ? '\u26A0\uFE0F' : '\u274C';

    var inputList = m.input.map(function(i){ return '<li>'+i+'</li>'; }).join('');

    resultDiv.innerHTML =
      '<div class="apply-sim-card">' +
        '<div class="apply-sim-card-header">' + m.name + '</div>' +
        '<div class="apply-sim-card-body">' +
          '<div class="apply-sim-block">' +
            '<div class="apply-sim-block-title">필요 Input</div>' +
            '<ul>' + inputList + '</ul>' +
            '<p><strong>수집 주기:</strong> ' + m.inputCycle + '</p>' +
            '<p><strong>최소 데이터량:</strong> ' + m.minData + '</p>' +
          '</div>' +
          '<div class="apply-sim-block">' +
            '<div class="apply-sim-block-title">예상 Output</div>' +
            '<ul>' + (Array.isArray(m.output) ? m.output.map(function(o){ return '<li>'+o+'</li>'; }).join('') : '<li>'+m.output+'</li>') + '</ul>' +
            '<p><strong>예상 정확도:</strong> ' + m.accuracy + '</p>' +
          '</div>' +
          '<div class="apply-sim-block">' +
            '<div class="apply-sim-block-title">필요 조건</div>' +
            '<p><strong>하드웨어:</strong> ' + m.hardware + '</p>' +
            '<p><strong>비용:</strong> ' + m.cost + '</p>' +
          '</div>' +
          '<div class="apply-sim-block">' +
            '<div class="apply-sim-block-title">현재 적용 가능 여부</div>' +
            '<p class="' + statusClass + '" style="font-size:.95rem">' + statusIcon + ' ' + m.statusText + '</p>' +
          '</div>' +
        '</div>' +
        '<div class="apply-sim-disclaimer">' +
          '\u26A0\uFE0F 면책 문구: 논문 수치는 실험 환경 기준이며, 실제 적용 시 다를 수 있습니다. 성능 수치는 참고용으로만 활용하세요.' +
        '</div>' +
      '</div>';
  };
})();
