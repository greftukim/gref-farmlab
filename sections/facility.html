<style>
.fac-vision{padding:26px 0 6px}
.fac-vision-title{font-size:20px;font-weight:700;color:var(--fg);margin-bottom:10px;letter-spacing:-.01em}
.fac-vision-desc{font-size:14px;line-height:1.75;color:var(--fg-secondary)}
.fac-section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-muted);margin:28px 0 12px;border-bottom:1px solid var(--border-light);padding-bottom:6px}
.fac-fig{margin:0;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff}
.fac-fig img{display:block;width:100%;height:auto}
.fac-cap{font-size:12px;color:var(--fg-muted);line-height:1.6;margin:8px 2px 0}
.fac-divider{border:none;border-top:1px solid var(--border);margin:34px 0}
</style>

<div class="container">

  <div class="fac-vision">
    <div class="fac-vision-title edit-target" spellcheck="false">설비 관리체계</div>
    <div class="fac-vision-desc edit-target" spellcheck="false">
      흩어진 온실 설비 유지보수 정보를 <strong style="color:var(--fg)">표준 데이터로 축적</strong>하고, <strong style="color:var(--fg)">AI로 현장 대응을 돕는</strong> 체계를 구축한다. 담당: 김용찬 과장(설비·전기·에너지·공조).
    </div>
  </div>

  <div class="fac-section-label edit-target" spellcheck="false">진행 방향 — 3단계</div>
  <figure class="fac-fig"><img src="images/설비_3단계_로드맵.png" alt="설비 유지보수 3단계 로드맵" loading="lazy"></figure>
  <div class="fac-cap edit-target" spellcheck="false">이력 표준화·축적(현재) → 관리대장·매뉴얼 → AI 검색(RAG) 대응·전 지점 확산.</div>

  <hr class="fac-divider">

  <div class="fac-section-label edit-target" spellcheck="false">유지보수 이력 — 작성 예시</div>
  <figure class="fac-fig"><img src="images/설비이력_양식예시.png" alt="설비 유지보수 이력 카드 예시" loading="lazy"></figure>
  <div class="fac-cap edit-target" spellcheck="false">실제 기록(1번온실 3번 AHU 모터 교체) 기반 예시 — 발생현상·원인·해결과정·작업난이도(S~D)·부품정보·예방대책을 표준 양식으로 기록.</div>

</div>
