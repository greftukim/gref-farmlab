<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farm LAB 운영전략 — GREF</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
:root {
  --bg: #ffffff;
  --fg: #111111;
  --fg-secondary: #555555;
  --fg-muted: #999999;
  --fg-unconfirmed: #b0b0b0;
  --border: #e0e0e0;
  --border-light: #f0f0f0;
  --accent: #111111;
  --accent-light: #f5f5f5;
  --accent2: #333333;
  --surface: #ffffff;
  --surface2: #f5f5f5;
  --text: #111111;
  --text2: #555555;
  --text3: #999999;
  --border-mid: rgba(0,0,0,0.18);
  --tag-env: #1a1a1a;
  --tag-growth: #444444;
  --tag-vision: #666666;
  --tag-timeseries: #333333;
  --tag-sim: #555555;
  --tag-platform: #222222;
  --tag-ai: #777777;
  --card-hover: 0 2px 20px rgba(0,0,0,0.06);
  --radius: 2px;
  --font-sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-mono: "SF Mono", "Fira Code", "Fira Mono", "Roboto Mono", monospace;
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --shadow: 0 1px 3px rgba(0,0,0,0.07), 0 4px 16px rgba(0,0,0,0.04);
  --e1-bg:#E6F1FB;--e1-text:#0C447C;
  --e2-bg:#EAF3DE;--e2-text:#27500A;
  --e3-bg:#FAEEDA;--e3-text:#633806;
  --e4-bg:#EEEDFE;--e4-text:#3C3489;
  --tag-rl-bg:#FCEBEB;--tag-rl:#791F1F;
  --tag-cv-bg:#E1F5EE;--tag-cv:#085041;
  --tag-ml-bg:#E6F1FB;--tag-ml:#0C447C;
  --tag-dp-bg:#FAEEDA;--tag-dp:#633806;
  --tag-dl-bg:#EEEDFE;--tag-dl:#3C3489;
  --tag-rb-bg:#F1EFE8;--tag-rb:#444441;
  --tag-bayes-bg:#FBEAF0;--tag-bayes:#72243E;
  --unique-bg:#EEEDFE;--unique-text:#3C3489;--unique-border:#AFA9EC;
  --tag-ai-bg:#E6F1FB;--tag-ai:#0C447C;
  --tag-robot-bg:#F1EFE8;--tag-robot:#444441;
  --tag-energy-bg:#FAEEDA;--tag-energy:#633806;
  --tag-prod-bg:#EAF3DE;--tag-prod:#27500A;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
button, input, select, textarea { font-family: var(--font-sans); }
html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--fg);
  line-height: 1.6;
  font-size: 14px;
  letter-spacing: -0.01em;
  min-height: 100vh;
}
body.locked { overflow: hidden; }

/* ── STICKY BLUR HEADER ── */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}

.header-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 20px 32px 0;
}

.header-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 16px;
}

.logo {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.logo span { font-weight: 300; color: var(--fg-muted); margin-left: 8px; letter-spacing: 0.04em; text-transform: none; }

.header-sub {
  font-size: 12px;
  color: var(--fg-muted);
  letter-spacing: 0.02em;
}

/* ── NAV TABS ── */
.tabs, .top-nav {
  display: flex;
  gap: 0;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.tabs::-webkit-scrollbar, .top-nav::-webkit-scrollbar { display: none; }

.tab-btn, .top-nav-btn {
  background: none;
  border: none;
  padding: 10px 20px;
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 500;
  color: var(--fg-muted);
  cursor: pointer;
  white-space: nowrap;
  border-bottom: 2px solid transparent;
  transition: all var(--transition);
  letter-spacing: 0.02em;
}

.tab-btn:hover, .top-nav-btn:hover { color: var(--fg); }
.tab-btn.active, .top-nav-btn.active { color: var(--fg); border-bottom-color: var(--fg); font-weight: 600; }

/* ── MAIN ── */
.main-content {
  max-width: 1280px;
  margin: 0 auto;
  padding: 32px;
  min-height: calc(100vh - 120px);
}

/* ── Section containers ── */
.section { display: none; }
.section.active { display: block; }

/* ── Sub-tabs ── */
.container { max-width: 980px; margin: 0 auto; padding: 14px 18px 32px; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── Cards & common ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:8px;width:fit-content;max-width:100%;}
.card-header{padding:8px 14px;background:var(--surface2);border-bottom:1px solid var(--border);}
.card-title{font-weight:500;font-size:15px;color:var(--text);}
.card-sub{font-size:12px;color:var(--text3);margin-top:2px;}
.card-body{padding:10px 14px;overflow-x:auto;}
.sl{font-size:10.5px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin:12px 0 6px;font-family:'Pretendard',sans-serif;}
.sl:first-child{margin-top:0;}
.desc{font-size:13px;color:var(--text2);line-height:1.7;}

/* ── KPI row ── */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px;}
@media(max-width:640px){.kpi-row{grid-template-columns:repeat(2,1fr);}}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;box-shadow:var(--shadow);}
.kpi-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px;}
.kpi-val{font-size:22px;font-weight:700;color:var(--text);line-height:1.2;}
.kpi-unit{font-size:12px;color:var(--text3);font-weight:400;margin-left:3px;}
.kpi-note{font-size:11px;color:var(--text3);margin-top:4px;}

/* ── Tables ── */
.data-table{width:auto;border-collapse:collapse;font-size:13px;}
.data-table th{background:var(--surface2);color:var(--text3);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;padding:6px 8px;text-align:left;border-bottom:1px solid var(--border);}
.data-table td{padding:6px 8px;border-bottom:1px solid var(--border);color:var(--text);line-height:1.4;text-align:left;}
.data-table tr:last-child td{border-bottom:none;}
.data-table tr:hover td{background:var(--surface2);}
.num{text-align: left;font-family:'Pretendard',sans-serif;}

/* ── P&L table ── */
.pl-table{width:auto;border-collapse:collapse;font-size:13px;}
.pl-table td{padding:3px 6px;border-bottom:1px solid var(--border);color:var(--text);text-align:left;vertical-align:middle;}
.pl-table tr:last-child td{border-bottom:none;}
.pl-section{background:var(--surface2);font-weight:500;}
.pl-total{font-weight:700;color:var(--accent);}
.pl-sub{padding-left:20px !important;color:var(--text2);text-align:left;}
.pl-num{text-align: left;}
.pl-pct{text-align: left;color:var(--text3);}

/* ── Grid layouts ── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
@media(max-width:640px){.two-col{grid-template-columns:1fr;}}
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
@media(max-width:640px){.three-col{grid-template-columns:1fr;}}

/* ── Monthly chart bars ── */
.month-chart{display:flex;align-items:flex-end;gap:4px;height:100px;margin:8px 0;}
.month-bar-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;}
.month-bar{width:100%;border-radius:3px 3px 0 0;background:var(--accent2);min-height:2px;transition:height 0.3s;}
.month-label{font-size:10px;color:var(--text3);}
.month-val{font-size:9px;color:var(--text2);}

/* ── Greenhouse SVG wrapper ── */
.gh-illustration{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px;margin-bottom:16px;box-shadow:var(--shadow);}
.gh-title{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:0.07em;padding:8px 12px 4px;}

/* ── Notes ── */
.note-block{padding:6px 10px;border-radius:6px;border-left:3px solid;font-size:12.5px;line-height:1.55;margin-bottom:6px;}
.note-tip{border-color:#3B6D11;background:var(--e2-bg);color:var(--e2-text);}
.note-info{border-color:#185FA5;background:var(--e1-bg);color:var(--e1-text);}
.divider{height:1px;background:var(--border);margin:8px 0;}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;}
.badge-green{background:var(--e2-bg);color:var(--e2-text);}
.badge-blue{background:var(--e1-bg);color:var(--e1-text);}
.badge-amber{background:var(--e3-bg);color:var(--e3-text);}
.badge-purple{background:var(--e4-bg);color:var(--e4-text);}

/* ── Vision diff table ── */
.diff-table{width:100%;border-collapse:collapse;font-size:13px;}
.diff-table th{background:var(--accent);color:#fff;padding:9px 14px;text-align:left;font-weight:500;font-size:12px;}
.diff-table td{padding:9px 14px;border-bottom:1px solid var(--border);color:var(--text);}
.diff-table .row-label{background:var(--surface2);font-weight:500;color:var(--text2);}
.diff-bad{color:#791F1F;}
.diff-good{color:#27500A;font-weight:500;}

/* ── Process steps ── */
.process-row{display:flex;align-items:flex-start;gap:0;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;}
.proc-step{flex:1;min-width:90px;text-align:center;position:relative;}
.proc-step::after{content:'→';position:absolute;right:-8px;top:14px;color:var(--text3);font-size:14px;}
.proc-step:last-child::after{display:none;}
.proc-num{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 6px;}
.proc-name{font-size:11px;font-weight:500;color:var(--text);line-height:1.4;}
.proc-sub{font-size:10px;color:var(--text3);margin-top:2px;line-height:1.4;}

/* ── Tag styles for AI tabs ── */
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;margin:2px 2px 2px 0;line-height:1.6;}
.tag-rl{background:var(--tag-rl-bg);color:var(--tag-rl);}
.tag-cv{background:var(--tag-cv-bg);color:var(--tag-cv);}
.tag-ml{background:var(--tag-ml-bg);color:var(--tag-ml);}
.tag-dp{background:var(--tag-dp-bg);color:var(--tag-dp);}
.tag-dl{background:var(--tag-dl-bg);color:var(--tag-dl);}
.tag-rb{background:var(--tag-rb-bg);color:var(--tag-rb);}
.tag-bayes{background:var(--tag-bayes-bg);color:var(--tag-bayes);}

/* ── Model cards (AI) ── */
.model-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden;}
.model-header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--border);}
.edition-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
.e1{background:var(--e1-bg);color:var(--e1-text);}
.e2{background:var(--e2-bg);color:var(--e2-text);}
.e3{background:var(--e3-bg);color:var(--e3-text);}
.e4{background:var(--e4-bg);color:var(--e4-text);}
.e-ref{background:var(--surface2);color:var(--text3);font-size:10px;border:1px solid var(--border);}
.model-name{font-weight:500;font-size:15px;color:var(--text);}
.model-team{font-size:12px;color:var(--text3);margin-top:2px;}
.model-body{padding:14px 16px;}
.access-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.access-badge{padding:4px 10px;border-radius:6px;font-size:12px;font-weight:500;border:1px solid transparent;}
.badge-open{background:var(--e2-bg);color:var(--e2-text);border-color:#C0DD97;}
.badge-comm{background:var(--e1-bg);color:var(--e1-text);border-color:#85B7EB;}
.badge-partial{background:var(--e3-bg);color:var(--e3-text);border-color:#EF9F27;}

/* ── CMP table ── */
.cmp-summary-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
@media(max-width:700px){.cmp-summary-row{grid-template-columns:repeat(2,1fr);}}
.cmp-sum-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);}
.cmp-sum-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;margin-bottom:7px;}
.cmp-sum-name{font-weight:500;font-size:13px;color:var(--text);margin-bottom:2px;}
.cmp-sum-meta{font-size:11px;color:var(--text3);margin-bottom:7px;}
.cmp-sum-crop{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);margin-bottom:8px;}
.cmp-kpi-val{font-size:20px;font-weight:700;color:var(--text);}
.cmp-kpi-unit{font-size:11px;color:var(--text3);margin-left:2px;}
.cmp-sum-profit{font-size:12px;font-weight:500;color:var(--e2-text);}
.cmp-table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow-x:auto;}
.cmp-table{width:100%;border-collapse:collapse;min-width:700px;}
.cmp-th-label{background:var(--surface2);color:var(--text3);font-size:11px;font-weight:500;padding:10px 12px;text-align:left;width:120px;border-right:1px solid var(--border);text-transform:uppercase;letter-spacing:0.05em;}
.cmp-th{padding:10px 12px;text-align:left;font-size:12px;font-weight:500;border-right:1px solid var(--border);}
.cmp-th:last-child{border-right:none;}
.cmp-th.e1{background:var(--e1-bg);color:var(--e1-text);}
.cmp-th.e2{background:var(--e2-bg);color:var(--e2-text);}
.cmp-th.e3{background:var(--e3-bg);color:var(--e3-text);}
.cmp-th.e4{background:var(--e4-bg);color:var(--e4-text);}
.cmp-th-sub{display:block;font-weight:400;font-size:11px;opacity:0.75;margin-top:2px;}
.cmp-table td{padding:4px 6px;vertical-align:top;border-bottom:1px solid var(--border);border-right:1px solid var(--border);font-size:12.5px;color:var(--text);line-height:1.45;text-align:left;}
.cmp-table td:last-child{border-right:none;}
.cmp-table tr:last-child td{border-bottom:none;}
.cmp-row-label{background:var(--surface2);color:var(--text2);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.04em;}
.cmp-row-highlight td{background:#FAFAF7;}
.cmp-meta{font-size:11px;color:var(--text3);display:block;margin-top:2px;line-height:1.5;}
.cmp-plus{color:var(--e2-text);}
.cmp-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;}
.cmp-list li{font-size:12px;color:var(--text2);padding-left:12px;position:relative;line-height:1.55;}
.cmp-list li::before{content:'+';position:absolute;left:0;color:var(--e2-text);font-weight:700;}
.cmp-list.minus li::before{content:'−';color:var(--tag-rl);}
.cmp-avail{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;margin-bottom:4px;}
.cmp-avail.yes{background:var(--e2-bg);color:var(--e2-text);}
.cmp-avail.partial{background:var(--e3-bg);color:var(--e3-text);}
.cmp-avail-desc{font-size:12px;color:var(--text3);line-height:1.5;}
.cmp-cost{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;}
.cmp-cost.low{background:var(--e2-bg);color:var(--e2-text);}
.cmp-cost.mid{background:var(--e3-bg);color:var(--e3-text);}
.cmp-cost.high{background:var(--tag-rl-bg);color:var(--tag-rl);}
.cmp-badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:500;margin:2px 2px 2px 0;border:1px solid transparent;}
.cmp-badge.yes{background:var(--e2-bg);color:var(--e2-text);border-color:#C0DD97;}
.cmp-badge.partial{background:var(--e3-bg);color:var(--e3-text);border-color:#EF9F27;}
.cmp-badge.no{background:var(--surface2);color:var(--text3);border-color:var(--border-mid);}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:500;}
.pill-go{background:var(--e2-bg);color:var(--e2-text);}
.pill-mid{background:var(--e3-bg);color:var(--e3-text);}
.pill-hard{background:var(--tag-rl-bg);color:var(--tag-rl);}
.app-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px;}
.app-table{width:100%;border-collapse:collapse;}
.app-table th{background:var(--surface2);color:var(--text3);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;padding:3px 6px;text-align:left;border-bottom:1px solid var(--border);}
.app-table td{padding:3px 6px;vertical-align:top;border-bottom:1px solid var(--border);font-size:12.5px;color:var(--text);line-height:1.4;text-align:left;}
.app-table tr:last-child td{border-bottom:none;}

/* ── Data items ── */
.data-legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--text2);}
.legend-item{display:flex;align-items:center;gap:6px;}
.legend-dot{width:10px;height:10px;border-radius:2px;}
.ld-req{background:var(--surface);border:1.5px solid var(--border-mid);}
.ld-opt{background:var(--surface2);border:1px solid var(--border);opacity:0.7;}
.ld-uni{background:var(--unique-bg);border:1px solid var(--unique-border);}
.data-group{margin-bottom:10px;}
.data-group-title{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:5px;}
.data-list{display:flex;flex-wrap:wrap;gap:4px;}
.data-item{display:inline-block;padding:3px 9px;border-radius:5px;font-size:12px;border:1px solid var(--border);color:var(--text2);background:var(--surface2);white-space:nowrap;}
.data-item.required{border-color:var(--border-mid);color:var(--text);background:var(--surface);font-weight:500;}
.data-item.optional{opacity:0.6;}
.data-item.unique{background:var(--unique-bg);color:var(--unique-text);border-color:var(--unique-border);font-weight:500;}

/* ── IO tab ── */
.io-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden;}
.io-header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--border);}
.io-body{padding:16px;}
.io-flow{display:grid;grid-template-columns:1fr 44px 1fr;gap:0;align-items:start;margin-bottom:16px;}
@media(max-width:600px){.io-flow{grid-template-columns:1fr;}}
.io-col{background:var(--surface2);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.io-col-header{padding:7px 12px;font-size:10.5px;font-weight:500;text-transform:uppercase;letter-spacing:0.07em;border-bottom:1px solid var(--border);}
.io-col-in .io-col-header{color:var(--e1-text);background:var(--e1-bg);}
.io-col-out .io-col-header{color:var(--e2-text);background:var(--e2-bg);}
.io-col-body{padding:10px 12px;}
.io-arrow{display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--text3);padding-top:26px;}
.io-item{display:flex;align-items:baseline;gap:6px;padding:4px 0;border-bottom:1px solid var(--border);font-size:12px;}
.io-item:last-child{border-bottom:none;}
.io-item-label{font-weight:500;color:var(--text);flex:1;line-height:1.5;}
.io-item-unit{font-size:10px;color:var(--text3);white-space:nowrap;}
.io-group-title{font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:0.07em;margin:8px 0 4px;}
.io-group-title:first-child{margin-top:0;}
.io-decision-block{margin-top:12px;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;}
.io-decision-title{font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:7px;}
.io-decision-items{display:flex;flex-wrap:wrap;gap:4px;}
.io-decision-item{padding:2px 8px;border-radius:12px;font-size:11px;font-weight:500;border:1px solid transparent;}
.io-d-climate{background:var(--e1-bg);color:var(--e1-text);border-color:#85B7EB;}
.io-d-irrig{background:#E1F5EE;color:#085041;border-color:#5DCAA5;}
.io-d-crop{background:var(--e3-bg);color:var(--e3-text);border-color:#EF9F27;}
.io-d-ipm{background:var(--tag-rl-bg);color:var(--tag-rl);border-color:#F09595;}
.io-d-econ{background:var(--e4-bg);color:var(--e4-text);border-color:#AFA9EC;}
.io-out-item{padding:4px 0;font-size:12px;color:var(--text);border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:6px;}
.io-out-item:last-child{border-bottom:none;}
.io-out-label{flex:1;font-weight:500;line-height:1.5;}
.io-out-detail{font-size:10px;color:var(--text3);}
.out-freq-badge{display:inline-block;padding:1px 6px;border-radius:9px;font-size:9px;font-weight:500;margin-left:4px;background:var(--surface2);color:var(--text3);border:1px solid var(--border);}

/* ── Dev plan ── */
.dp-hero{display:flex;gap:20px;flex-wrap:wrap;background:var(--accent);color:#fff;border-radius:var(--radius);padding:22px 26px;margin-bottom:18px;}
.dp-hero-left{flex:1;min-width:200px;}
.dp-hero-label{font-size:11px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:5px;}
.dp-hero-title{font-size:18px;font-weight:700;line-height:1.3;margin-bottom:6px;}
.dp-hero-desc{font-size:12px;color:rgba(255,255,255,0.6);line-height:1.6;}
.dp-hero-right{display:flex;flex-direction:column;gap:7px;min-width:210px;}
.dp-meta-item{display:flex;justify-content:space-between;gap:10px;font-size:12px;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:5px;}
.dp-meta-label{color:rgba(255,255,255,0.5);}
.dp-meta-val{color:#fff;font-weight:500;}
.dp-arch{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;margin-bottom:18px;box-shadow:var(--shadow);}
.dp-arch-label{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:10px;}
.dp-arch-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.dp-arch-block{flex:1;min-width:110px;border-radius:7px;padding:10px 12px;text-align:center;border:1px solid var(--border);}
.dp-layer1{background:var(--e2-bg);border-color:#C0DD97;}
.dp-layer2{background:var(--e3-bg);border-color:#EF9F27;}
.dp-layer3{background:var(--e4-bg);border-color:#AFA9EC;}
.dp-arch-block-title{font-size:13px;font-weight:500;color:var(--text);}
.dp-arch-block-sub{font-size:11px;color:var(--text3);margin-top:2px;}
.dp-arch-arrow{font-size:16px;color:var(--text3);flex-shrink:0;}
.dp-step-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden;}
.dp-step-header{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--surface2);border-bottom:1px solid var(--border);}
.dp-step-badge{width:52px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:12px;flex-shrink:0;white-space:nowrap;}
.dp-step-info{flex:1;}
.dp-step-name{font-weight:500;font-size:14px;color:var(--text);}
.dp-step-meta{font-size:11px;color:var(--text3);margin-top:2px;}
.dp-step-duration{font-size:12px;font-weight:500;color:var(--text2);white-space:nowrap;}
.dp-step-body{padding:14px 18px;}
.dp-col-wrap{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:600px){.dp-col-wrap{grid-template-columns:1fr;}}
.dp-col-title{font-size:10.5px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:7px;}
.dp-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;}
.dp-list li{font-size:12px;color:var(--text2);padding-left:13px;position:relative;line-height:1.55;}
.dp-list li::before{content:'+';position:absolute;left:0;color:var(--e2-text);font-weight:700;font-size:12px;}
.dp-list.minus li::before{content:'−';color:var(--tag-rl);}
.dp-inner-table{width:100%;border-collapse:collapse;font-size:12px;}
.dp-inner-table th{background:var(--surface2);color:var(--text3);padding:3px 6px;text-align:left;border-bottom:1px solid var(--border);font-weight:500;}
.dp-inner-table td{padding:3px 6px;border-bottom:1px solid var(--border);color:var(--text);line-height:1.4;text-align:left;}
.dp-inner-table tr:last-child td{border-bottom:none;}
.dp-flow{display:grid;grid-template-columns:1fr 18px 1fr 18px 1fr 18px 1fr;align-items:center;gap:3px;margin-top:4px;}
.dp-flow-item{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:7px 5px;text-align:center;font-size:11px;font-weight:500;color:var(--text);line-height:1.4;}
.dp-flow-item span{display:block;font-size:9px;font-weight:400;color:var(--text3);margin-top:2px;}
.dp-flow-arr{text-align:center;font-size:13px;color:var(--text3);}
.dp-output-card{border:1px solid var(--border);border-radius:6px;padding:9px 11px;margin-bottom:7px;}
.dp-output-title{font-size:13px;font-weight:500;color:var(--text);margin-bottom:2px;}
.dp-output-desc{font-size:11px;color:var(--text3);line-height:1.55;}
.dp-timeline-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-top:18px;}
.dp-timeline-title{padding:10px 14px;font-size:11px;font-weight:500;color:var(--text2);background:var(--surface2);border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:0.06em;}
.dp-tl-badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:700;}


/* ── Password Modal ── */
.pw-overlay { position:fixed; inset:0; z-index:10000; background:rgba(0,0,0,0.5); display:none; align-items:center; justify-content:center; }
.pw-overlay.visible { display:flex; }
.pw-box { background:#fff; border-radius:8px; padding:32px; max-width:360px; width:90%; box-shadow:0 8px 40px rgba(0,0,0,0.2); }
.pw-box h3 { font-size:16px; font-weight:700; margin-bottom:16px; }
.pw-box input { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:4px; font-size:14px; margin-bottom:12px; outline:none; font-family:var(--font-sans); }
.pw-box input:focus { border-color:var(--fg); }
.pw-error { color:#d73a49; font-size:13px; margin-bottom:8px; }
.pw-btns { display:flex; gap:8px; justify-content:flex-end; }
.pw-btn-cancel, .pw-btn-ok { padding:8px 16px; border:1px solid var(--border); border-radius:4px; cursor:pointer; font-size:13px; background:#fff; font-family:var(--font-sans); }
.pw-btn-ok { background:var(--fg); color:#fff; border-color:var(--fg); }
.pw-btn-ok:hover { opacity:0.9; }

  text-align: center;
  padding: 24px;
  font-size: 11px;
  color: var(--fg-muted);
  border-top: 1px solid var(--border-light);
  margin-top: 40px;
}

<script>
function switchSection(name, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('#main-tabs .tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('section-'+name).classList.add('active');
  btn.classList.add('active');
}

function filterModels(cat, btn) {
  const cards = document.querySelectorAll('#modelCardGrid .model-card');
  cards.forEach(c => {
    if (cat === 'all') {
      c.style.display = '';
    } else if (cat === 'opensource') {
      c.style.display = c.dataset.opensource === 'true' ? '' : 'none';
    } else {
      c.style.display = c.dataset.cat === cat ? '' : 'none';
    }
  });
  document.querySelectorAll('#modelFilterBar button').forEach(b => {
    b.style.background = '';
    b.style.color = '';
    b.style.borderColor = 'transparent';
    b.style.fontWeight = '';
  });
  if (cat === 'all') {
    btn.style.background = 'var(--accent)';
    btn.style.color = '#fff';
    btn.style.borderColor = 'var(--accent)';
  } else {
    btn.style.borderColor = 'currentColor';
    btn.style.fontWeight = '700';
  }
}

function switchTab(id, btn, section) {
  document.querySelectorAll('#section-'+section+' .tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('#section-'+section+' .tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  btn.classList.add('active');
}
</script>
<script>
// ═══════════════════════════════════════════════════════
// GREF ENGINE v4
// ═══════════════════════════════════════════════════════

// ── STATE ──
const S = {
  H_ridge:6, H_eave:5, W_span:7.17,
  W_left:42, W_right:45, W_corr:3, L_prod:110.2,
  ht_roof:7.5, fr_roof:0.65, ht_wall:2.3, fr_wall:0,
  Ts:12, Td:-11.8, Tg:4.43, hv:0.5, hs:0.244, fw:1.0,
  hp_heat_rated:200, derate_heat:0.85, safety_heat:1.15,
  Ts_c:28, Td_s:34.4, Tw:27, Tg_s:18,
  I_sol:700, tau:0.85, f_shade:0.5,
  hp_cool_rated:400, derate_cool:0.9, safety_cool:1.15, COP_cool:3.5,
  Lb:3.2, Wb:1.7, Nb:1382,
  Nt:20, Wts:2.3, Nbl:65, Wbs:0.56,
  f_trigger:0.5, H_water:0.04,
  F_daily:5, f_evap:0.05, N_zone:4, R_reuse:0.1, R_RO:0.7,
  // ── 생산계획 ──
  total_area_m2: 8600,          // 총 온실면적 m²
  corridor_m2: 1081.6,          // 복도+통로
  prod_area_m2: 7518.4,         // 생산면적 = total - corridor
  shrink: 0.15,                 // 축소율 15%
  bench_area: 5.44,             // 벤치 면적 3.2*1.7
  plug_density: 720,            // 프러그 주/m²
  cube_density: 12,             // 큐브 주/m²
  utilization: 0.75,            // 가동률 75%
  // 작물별 생산비율 (프러그:큐브)
  tomato_plug_pct: 0.5,
  tomato_cube_pct: 1.0,
  cucumber_plug_pct: 0,
  cucumber_cube_pct: 1.0,
  paprika_plug_pct: 0.5,
  paprika_cube_pct: 1.0,
  // 육묘일수
  tomato_plug_days: 40,
  tomato_cube_days: 60,
  cucumber_cube_days: 28,
  paprika_plug_days: 18,
  paprika_cube_days: 30,
  // 점유율
  national_demand: 91506613,
  national_share: 0.06,
  regional_demand: 25347332,
  regional_share: 0.20,
  // ── 가격정책 ──
  price_tomato_plug: 550,
  price_tomato_cube: 3000,
  price_paprika_plug: 200,
  price_paprika_cube: 2000,
  price_cucumber_cube: 2500,
  // ── 손익 ──
  waste_rate: 0.01,             // 폐기율 1%
  cost_labor_pct: 0.20,         // 인건비 매출비 20%
  cost_material_pct: 0.10,      // 자재비 매출비 10%
  cost_energy_annual: 0,        // 에너지비 (별도 입력)
  cost_depreciation: 0,         // 감가상각 (투자상세에서)
  cost_maintenance: 450,        // 유지보수 (백만)
  cost_admin_pct: 0.10,         // 관리비 매출비 10%
  cost_sales_pct: 0.02,         // 판매비 매출비 2%
  // ── 투자 ──
  invest_land: 35000000,
  invest_greenhouse: 4500000000,
  invest_material: 201000000,
  invest_automation: 1358000000,
  tta_exchange_rate: 1722,
};

// ── COMPUTE ──
function calc() {
  const s=S, v={};
  v.W_total = s.W_left+s.W_right+s.W_corr;
  v.As = v.W_total*s.L_prod;
  const dH=s.H_ridge-s.H_eave, hs2=s.W_span/2;
  const k=Math.sqrt(1+(dH/hs2)**2);
  v.Ar    = (s.W_left+s.W_right)*s.L_prod*k;
  v.Ag1   = (s.W_left+s.W_right)*s.H_eave*2+(s.W_left+s.W_right)*dH/2*2;
  v.Ag2   = s.L_prod*s.H_eave*2;
  v.A_total= v.Ar+v.Ag1+v.Ag2;
  const dT_h=s.Ts-s.Td;
  v.Qh_roof  = v.Ar    *s.ht_roof*dT_h*(1-s.fr_roof);
  v.Qh_wall1 = v.Ag1   *s.ht_wall*dT_h*(1-s.fr_wall);
  v.Qh_wall2 = v.Ag2   *s.ht_wall*dT_h*(1-s.fr_wall);
  v.Qh_vent  = v.A_total*s.hv*dT_h;
  v.Qh_floor = v.As*s.hs*(s.Ts-s.Tg);
  v.Qh_total = (v.Qh_roof+v.Qh_wall1+v.Qh_wall2+v.Qh_vent+v.Qh_floor)*s.fw;
  v.Qh_RT    = v.Qh_total/3024;
  v.hp_heat_act=s.hp_heat_rated*s.derate_heat;
  v.Qh_req   = v.Qh_RT*s.safety_heat;
  v.Nh_heat  = Math.ceil(v.Qh_req/v.hp_heat_act);
  const dT_c=s.Td_s-s.Ts_c;
  v.Qc_sol   = s.I_sol*s.tau*(1-s.f_shade)*v.Ar*0.86;
  v.Qc_roof  = s.ht_roof*dT_c*v.Ar;
  v.Qc_wall  = s.ht_wall*dT_c*(v.Ag1+v.Ag2);
  v.Qc_vent  = s.hv*dT_c*v.A_total;
  v.Qc_gnd   = -s.hs*(s.Ts_c-s.Tg_s)*v.As;
  v.Qi       = v.As*20*0.86;
  v.Qc_total = v.Qc_sol+v.Qc_roof+v.Qc_wall+v.Qc_vent+v.Qc_gnd+v.Qi;
  v.Qc_RT    = v.Qc_total/3024;
  v.Qc_kW    = v.Qc_total/1.163;
  v.Qc_m2    = v.Qc_total/v.As;
  v.hp_cool_act=s.hp_cool_rated*s.derate_cool;
  v.Qc_req   = v.Qc_RT*s.safety_cool;
  v.Nh_cool  = Math.ceil(v.Qc_req/v.hp_cool_act);
  v.Nh_max   = Math.max(v.Nh_heat,v.Nh_cool);
  const Ab_t=s.Wts*s.f_trigger, Ab_b=s.Wbs*s.f_trigger;
  v.Q_abs    = Math.max(s.Nt*Ab_t, s.Nbl*Ab_b);
  v.A_bench  = s.Lb*s.Wb;
  v.Q_fill   = v.A_bench*s.H_water*1000;
  v.Q_drain  = v.Q_fill-v.Q_abs;
  const Na=Math.floor(s.Nb);
  v.bench_d  = v.Q_abs*s.F_daily*(1+s.f_evap);
  v.gh_L     = v.bench_d*Na;
  v.zone_L   = v.Q_fill*Na/s.N_zone;
  v.raw_L    = v.gh_L*(1-s.R_reuse);
  v.intake_L = v.raw_L/s.R_RO;

  // ═══ 생산계획 계산 ═══
  v.prod_area = s.total_area_m2 - s.corridor_m2;
  v.shrink_area = v.prod_area * s.shrink;
  v.net_area = s.total_area_m2 - s.shrink_area; // 사용하지 않음, prod_area 기준
  v.bench_count = Math.round(v.prod_area / s.bench_area);
  v.bench_per_m2 = v.prod_area / s.bench_area;

  // 생산량 (연간)
  v.tomato_plug_annual = v.prod_area * s.plug_density * s.tomato_plug_pct * (365 / s.tomato_plug_days) * s.utilization;
  v.tomato_cube_annual = v.prod_area * s.cube_density * s.tomato_cube_pct * (365 / s.tomato_cube_days) * s.utilization;
  v.cucumber_cube_annual = v.prod_area * s.cube_density * s.cucumber_cube_pct * (365 / s.cucumber_cube_days) * s.utilization;
  v.paprika_plug_annual = v.prod_area * s.plug_density * s.paprika_plug_pct * (365 / s.paprika_plug_days) * s.utilization;
  v.paprika_cube_annual = v.prod_area * s.cube_density * s.paprika_cube_pct * (365 / s.paprika_cube_days) * s.utilization;
  v.total_annual = v.tomato_plug_annual + v.tomato_cube_annual + v.cucumber_cube_annual + v.paprika_plug_annual + v.paprika_cube_annual;

  // 점유율
  v.national_target = s.national_demand * s.national_share;
  v.regional_target = s.regional_demand * s.regional_share;
  v.target_production = Math.max(v.national_target, v.regional_target);

  // ═══ 매출 계산 ═══
  v.rev_tomato_plug = v.tomato_plug_annual * s.price_tomato_plug;
  v.rev_tomato_cube = v.tomato_cube_annual * s.price_tomato_cube;
  v.rev_cucumber_cube = v.cucumber_cube_annual * s.price_cucumber_cube;
  v.rev_paprika_plug = v.paprika_plug_annual * s.price_paprika_plug;
  v.rev_paprika_cube = v.paprika_cube_annual * s.price_paprika_cube;
  v.rev_total = v.rev_tomato_plug + v.rev_tomato_cube + v.rev_cucumber_cube + v.rev_paprika_plug + v.rev_paprika_cube;
  v.rev_after_waste = v.rev_total * (1 - s.waste_rate);

  // ═══ 손익 계산 ═══
  v.cost_labor = v.rev_after_waste * s.cost_labor_pct;
  v.cost_material = v.rev_after_waste * s.cost_material_pct;
  v.cost_depreciation = s.invest_greenhouse / 10 / 1000000; // 10년 감가 (백만원)
  v.cost_admin = v.rev_after_waste * s.cost_admin_pct;
  v.cost_sales = v.rev_after_waste * s.cost_sales_pct;
  v.cost_total_var = v.cost_labor + v.cost_material + s.cost_energy_annual;
  v.gross_profit = v.rev_after_waste - v.cost_total_var;
  v.cost_total_fixed = v.cost_admin + v.cost_sales + s.cost_maintenance;
  v.operating_profit = v.gross_profit - v.cost_total_fixed;
  v.ebitda = v.operating_profit + v.cost_depreciation;
  v.ebitda_margin = v.rev_after_waste > 0 ? v.ebitda / (v.rev_after_waste / 1000000) : 0;

  // ═══ 투자 계산 ═══
  v.invest_total = s.invest_land + s.invest_greenhouse + s.invest_material + s.invest_automation;
  v.invest_total_m = v.invest_total / 100000000; // 억원
  v.payback_years = v.ebitda > 0 ? (v.invest_total / 1000000) / v.ebitda : 0;

  return v;
}

let pptMode = false;
let currentSlide = 0;

function togglePptMode() {
  pptMode = !pptMode;
  const btn = document.getElementById('pptModeBtn');
  const label = document.getElementById('pptModeLabel');

  if (pptMode) {
    document.body.classList.add('ppt-mode');
    btn.classList.add('ppt-active');
    label.textContent = 'PPT 종료';
    currentSlide = 0;
    showSlide(0);
    // Add exit button
    if (!document.getElementById('pptExitBtn')) {
      const exitBtn = document.createElement('button');
      exitBtn.id = 'pptExitBtn';
      exitBtn.className = 'ppt-exit-btn';
      exitBtn.textContent = 'ESC 나가기';
      exitBtn.onclick = togglePptMode;
      document.body.appendChild(exitBtn);
    }
    document.getElementById('pptExitBtn').style.display = 'block';
    // Add PPT edit button
    if (!document.getElementById('pptEditBtn')) {
      const editBtn = document.createElement('button');
      editBtn.id = 'pptEditBtn';
      editBtn.textContent = '편집';
      editBtn.style.cssText = 'position:fixed;top:8px;right:120px;z-index:10001;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;font-size:13px;cursor:pointer;font-weight:600';
      editBtn.onclick = togglePptEdit;
      document.body.appendChild(editBtn);
    }
    document.getElementById('pptEditBtn').style.display = 'block';
  } else {
    // Exit PPT edit mode if active
    if (pptEditMode) togglePptEdit();
    document.body.classList.remove('ppt-mode');
    btn.classList.remove('ppt-active');
    label.textContent = 'PPT 모드';
    const exitBtn = document.getElementById('pptExitBtn');
    if (exitBtn) exitBtn.style.display = 'none';
    const editBtn = document.getElementById('pptEditBtn');
    if (editBtn) editBtn.style.display = 'none';
  }
}

function showSlide(idx) {
  const slides = document.querySelectorAll('.ppt-slide');
  if (slides.length === 0) return;
  slides.forEach(s => s.classList.remove('active'));
  currentSlide = Math.max(0, Math.min(idx, slides.length - 1));
  slides[currentSlide].classList.add('active');
  const info = document.getElementById('pptInfo');
  if (info) info.textContent = (currentSlide + 1) + ' / ' + slides.length;
}

// ── PPT Edit Mode ──
let pptEditMode = false;
const pptUndoStack = [];
const pptRedoStack = [];
const PPT_MAX_UNDO = 50;

function pptSaveState() {
  const vp = document.getElementById('pptViewport');
  if (!vp) return;
  pptUndoStack.push(vp.innerHTML);
  if (pptUndoStack.length > PPT_MAX_UNDO) pptUndoStack.shift();
  pptRedoStack.length = 0; // clear redo on new action
}

function pptUndo() {
  if (pptUndoStack.length === 0) return;
  const vp = document.getElementById('pptViewport');
  if (!vp) return;
  pptRedoStack.push(vp.innerHTML);
  vp.innerHTML = pptUndoStack.pop();
  // Re-show current slide
  showSlide(currentSlide);
  // Re-enable editability
  if (pptEditMode) pptEnableEditing();
}

function pptRedo() {
  if (pptRedoStack.length === 0) return;
  const vp = document.getElementById('pptViewport');
  if (!vp) return;
  pptUndoStack.push(vp.innerHTML);
  vp.innerHTML = pptRedoStack.pop();
  showSlide(currentSlide);
  if (pptEditMode) pptEnableEditing();
}

function pptEnableEditing() {
  document.querySelectorAll('.ppt-slide .ppt-title, .ppt-slide .ppt-banner, .ppt-slide .ppt-sub-title, .ppt-slide .ppt-cover-label, .ppt-slide .ppt-cover-title, .ppt-slide .ppt-cover-sub, .ppt-slide td, .ppt-slide th, .ppt-slide .ppt-page-num').forEach(el => {
    el.contentEditable = 'true';
    el.spellcheck = false;
  });
}

// Ctrl+Z / Ctrl+Y handler
document.addEventListener('keydown', e => {
  if (!pptEditMode) return;
  if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
    e.preventDefault();
    pptUndo();
  }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) {
    e.preventDefault();
    pptRedo();
  }
  // Delete selected element with Delete key (not when editing text)
  if (e.key === 'Delete' && pptSelectedEl) {
    e.preventDefault();
    pptSaveState();
    pptSelectedEl.remove();
    pptSelectedEl = null;
  }
});

// Track selected element for deletion
let pptSelectedEl = null;
document.addEventListener('click', e => {
  if (!pptEditMode) return;
  // Clicking on a user-added element (dashed border) selects it for deletion
  const el = e.target.closest('[data-ppt-added]');
  if (el) {
    if (pptSelectedEl) pptSelectedEl.style.outline = '';
    pptSelectedEl = el;
    pptSelectedEl.style.outline = '2px solid #e53935';
  } else {
    if (pptSelectedEl) pptSelectedEl.style.outline = '';
    pptSelectedEl = null;
  }
});

// Save state before text edits (debounced)
let pptSaveTimer = null;
document.addEventListener('input', e => {
  if (!pptEditMode) return;
  if (!e.target.closest('.ppt-slide')) return;
  clearTimeout(pptSaveTimer);
  pptSaveTimer = setTimeout(() => pptSaveState(), 800);
});

function togglePptEdit() {
  pptEditMode = !pptEditMode;
  const btn = document.getElementById('pptEditBtn');
  if (!btn) return;

  if (pptEditMode) {
    btn.textContent = '편집 종료';
    btn.style.background = '#e53935';
    document.body.classList.add('ppt-edit-mode');
    // Save initial state for undo
    pptSaveState();
    pptEnableEditing();
    // Make grid containers resizable
    document.querySelectorAll('.ppt-slide [style*="display:grid"]').forEach(g => {
      g.style.resize = 'both';
      g.style.overflow = 'auto';
    });
    showPptToolbar();
  } else {
    btn.textContent = '편집';
    btn.style.background = '';
    document.body.classList.remove('ppt-edit-mode');
    document.querySelectorAll('.ppt-slide [contenteditable="true"]').forEach(el => {
      el.removeAttribute('contenteditable');
    });
    document.querySelectorAll('.ppt-slide [style*="display:grid"]').forEach(g => {
      g.style.resize = '';
      g.style.overflow = '';
    });
    hidePptToolbar();
    pptSelectedEl = null;
    // Clear stacks
    pptUndoStack.length = 0;
    pptRedoStack.length = 0;
  }
}

function showPptToolbar() {
  if (document.getElementById('pptToolbar')) return;
  const tb = document.createElement('div');
  tb.id = 'pptToolbar';
  tb.innerHTML = `
    <button onclick="pptUndo()" title="실행 취소 (Ctrl+Z)" style="padding:4px 10px;border:1px solid #ccc;border-radius:4px;background:#fff;cursor:pointer;font-size:12px">↩ 되돌리기</button>

    <span style="margin-left:8px;font-size:11px;color:#999">| Ctrl+Z 되돌리기 · 추가 요소 클릭 후 Delete 삭제</span>
  `;
  tb.style.cssText = 'position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:10002;display:flex;gap:6px;align-items:center;background:rgba(255,255,255,0.95);padding:6px 14px;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,0.15);backdrop-filter:blur(8px)';

function hidePptToolbar() {
  const tb = document.getElementById('pptToolbar');

}

function pptAddText() {
  const slide = document.querySelector('.ppt-slide.active .ppt-body');
  if (!slide) return;
  pptSaveState();
  const div = document.createElement('div');
  div.contentEditable = 'true';

function pptAddTable() {
  const slide = document.querySelector('.ppt-slide.active .ppt-body');

function pptAddDivider() {

function pptNext() {
  const slides = document.querySelectorAll('.ppt-slide');

// EDIT MODE
// ─────────────────────────────────────────
// 기본 모드: data-var 셀(파란 숫자)만 수정 가능
// 편집모드 ON: 모든 텍스트 수정 가능
// ═══════════════════════════════════════════════════════

let editMode = false;

// ── 1. Forbidden check ──
// 계산식 셀(cv_, data-formula, data-var)과 구조 요소는 편집 불가
function isForbidden(el) {
  if (!el) return true;
  const tag = el.tagName;
  // 스크립트/스타일/폼요소/이미지 제외
  if (['SCRIPT','STYLE','BUTTON','INPUT','SELECT','TEXTAREA','IMG','BR','HR','IFRAME','CANVAS','VIDEO','AUDIO'].includes(tag)) return true;
  // 네비게이션/버튼/SVG 내부 제외 (단, nav-label은 편집 허용)
  if (el.classList.contains('nav-label')) return false;
  if (el.closest('nav, button, svg, .top-nav, .tabs, .ppt-nav')) return true;
  // 계산식 셀 제외 (cv_ id = computed value)
  if (el.id && el.id.startsWith('cv_')) return true;
  // data-formula 속성이 있는 셀 제외
  if (el.hasAttribute && el.hasAttribute('data-formula')) return true;
  // 병합 셀 - 레이아웃 깨짐 방지
  if (tag==='TD'||tag==='TH') {
    if ((el.getAttribute('rowspan')||'1')!=='1') return true;
    if ((el.getAttribute('colspan')||'1')!=='1') return true;
    if (el.querySelector('table,ul,ol,div.formula')) return true;
  }
  return false;
}

// ── 1b. 텍스트를 직접 포함한 "잎(leaf)" 요소인지 판별 ──
function isTextLeaf(el) {
  // 자식 중 텍스트 노드가 있고, 그 텍스트가 공백이 아닌 경우
  for (const child of el.childNodes) {
    if (child.nodeType === 3 && child.textContent.trim().length > 0) return true;
  }
  return false;
}

// ── 1c. 편집 가능 요소 수집 ──
function collectEditableElements() {
  const result = [];
  // 모든 섹션 내 요소를 순회
  const sections = document.querySelectorAll('.section');
  sections.forEach(section => {
    // 페이지 헤더도 포함
    const allEls = section.querySelectorAll('*');
    allEls.forEach(el => {
      if (isForbidden(el)) return;
      // 이미 var-cell인 것은 별도 관리
      if (el.classList.contains('var-cell')) return;
      // contenteditable 속성이 이미 있는 교육 섹션 요소도 포함
      const tag = el.tagName;
      // 텍스트를 직접 담는 요소만 (leaf node)
      if (!isTextLeaf(el)) return;
      // 블록 컨테이너급 요소는 자식이 편집되므로 건너뜀
      // 단, 자식이 전부 인라인(텍스트+inline)이면 OK
      const hasBlockChild = Array.from(el.children).some(c => {
        const d = getComputedStyle(c).display;
        return d === 'block' || d === 'flex' || d === 'grid' || d === 'table';
      });
      if (hasBlockChild) return;
      result.push(el);
    });
  });
  // 페이지 헤더 (섹션 외부)
  document.querySelectorAll('.header *').forEach(el => {
    if (isForbidden(el)) return;
    if (el.classList.contains('var-cell')) return;
    if (!isTextLeaf(el)) return;
    result.push(el);
  });
  // 상단 네비게이션 라벨 (개요, 육묘, AI, 로봇, 교육)
  document.querySelectorAll('#main-tabs .nav-label').forEach(el => {
    result.push(el);
  });
  return result;
}

let editAuthenticated = false;
const GITHUB_OWNER = 'greftukim';
const GITHUB_REPO  = 'gref-farmlab';
const GITHUB_FILE  = 'index.html';
const GITHUB_BRANCH = 'master';
const _d=[0,27,17,14,25,3,61,23,19,17,57,93,80,32,81,42,45,53,38,56,82,82,6,43,8,94,16,41,37,68,92,33,54,62,7,5,48,6,41,33,47,48,41,68,12,0,0,83,27,87,8,41,43,30,24,42,4,65,41,30,8,32,19,5,61,47,33,6,34,90,8,49,60,1,95,36,51,46,42,50,49,57,59,46,82,67,9,52,14,16,21,31,65];
const _k='greflab';
function _gt(){return _d.map((c,i)=>String.fromCharCode(c^_k.charCodeAt(i%_k.length))).join('');}

function toggleEditMode() {

// ── GitHub 저장 함수 ──
function showNotification(msg, success) {
  const el = document.getElementById('saveNotification');
  el.textContent = msg;
  el.style.background = success ? '#2ea44f' : '#d73a49';
  el.style.color = '#fff';
  el.style.display = 'block';
  el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => { el.style.display = 'none'; }, 300); }, 3000);
}

async function saveToGithub() {
  if (!editAuthenticated) { showNotification('편집모드에서만 저장 가능합니다', false); return; }
  const githubToken = _gt();
  showNotification('GitHub에 저장 중...', true);

  try {
    // 1) 현재 파일의 SHA 가져오기
    const metaRes = await fetch(
      `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}?ref=${GITHUB_BRANCH}`,
      { headers: { 'Authorization': `token ${githubToken}` } }
    );
    if (!metaRes.ok) throw new Error('파일 정보를 가져올 수 없습니다');
    const metaData = await metaRes.json();
    const sha = metaData.sha;

    // 2) 현재 HTML 전체를 가져와서 업데이트
    const htmlContent = document.documentElement.outerHTML;
    // DOCTYPE 추가
    const fullHtml = '<!DOCTYPE html>\n' + htmlContent;
    // Base64 인코딩 (한글 지원)
    const encoded = btoa(unescape(encodeURIComponent(fullHtml)));

    // 3) GitHub API로 파일 업데이트
    const updateRes = await fetch(
      `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
      {
        method: 'PUT',
        headers: {
          'Authorization': `token ${githubToken}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: '웹 편집모드에서 콘텐츠 업데이트',
          content: encoded,
          sha: sha,
          branch: GITHUB_BRANCH
        })
      }
    );

    if (!updateRes.ok) {
      const err = await updateRes.json();
      throw new Error(err.message || '저장 실패');
    }

    showNotification('저장 완료! 1-2분 후 반영됩니다.', true);
  } catch (e) {
    showNotification('저장 실패: ' + e.message, false);
  }
}

function activateEditMode() {
  editMode = !editMode;
  const btn   = document.getElementById('editModeBtn');
  const bar   = document.getElementById('editModeBar');
  const label = document.getElementById('editModeLabel');

  if (editMode) {
    document.body.classList.add('edit-mode');
    btn.classList.add('active');
    label.textContent = '편집모드 OFF';
    bar.classList.add('visible');
    // 계산식 셀(cv_, data-var)을 제외한 모든 텍스트 요소를 편집 가능하게
    const editables = collectEditableElements();
    editables.forEach(el => {
      el.contentEditable = 'true';
      el.spellcheck = false;
      el.classList.add('edit-target');
    });
    // 테이블 셀 중 계산식이 아닌 것도 편집 가능
    document.querySelectorAll('.section td, .section th').forEach(el => {
      if (isForbidden(el)) return;
      if (el.classList.contains('var-cell')) return;
      if (el.classList.contains('edit-target')) return;
      // 자식에 다른 편집 가능 요소가 없는 경우만
      if (el.querySelector('[contenteditable="true"]')) return;
      if (!isTextLeaf(el)) return;
      el.contentEditable = 'true';
      el.spellcheck = false;
      el.classList.add('edit-target');
    });
    // 교육 섹션의 기존 contenteditable 요소도 활성화
    document.querySelectorAll('#section-education [contenteditable]').forEach(el => {
      el.setAttribute('contenteditable', 'true');
    });
  } else {
    document.body.classList.remove('edit-mode');
    btn.classList.remove('active');
    label.textContent = '편집모드 ON';
    bar.classList.remove('visible');
    // edit-target 클래스로 표시된 요소에서 편집 해제 (var-cell은 유지)
    document.querySelectorAll('.edit-target').forEach(el => {
      el.removeAttribute('contenteditable');
      el.classList.remove('edit-target');
    });
    // 교육 섹션 contenteditable 비활성화
    document.querySelectorAll('#section-education [contenteditable]').forEach(el => {
      if (el.classList.contains('var-cell')) return;
      el.setAttribute('contenteditable', 'false');
    });
    if (document.activeElement) document.activeElement.blur();
    // 편집 종료 시 자동으로 GitHub에 저장
    saveToGithub();
  }
}

// 퍼센트 변수 목록 (내부 0.06 저장, 표시 6%)
const PCT_VARS = new Set([
  'national_share','regional_share','shrink','utilization',
  'tomato_plug_pct','tomato_cube_pct','cucumber_plug_pct','cucumber_cube_pct',
  'paprika_plug_pct','paprika_cube_pct','waste_rate',
  'cost_labor_pct','cost_material_pct','cost_admin_pct','cost_sales_pct',
  'fr_roof','fr_wall','f_trigger','f_evap','R_reuse','R_RO',
  'derate_heat','derate_cool','f_shade'
]);

function formatVarDisplay(varName, val) {
  if (PCT_VARS.has(varName)) return (val * 100) + '%';
  return String(val);
}

// focusin: for data-var cells, show editable value and select all
document.addEventListener('focusin', e => {
  const el = e.target;
  if (!el.classList.contains('var-cell')) return;
  const varName = el.dataset.var;
  if (varName && S[varName] !== undefined) {
    el.dataset.prevText = el.textContent;
    // 퍼센트 변수는 % 단위로 표시 (6 = 0.06)
    const display = PCT_VARS.has(varName) ? String(S[varName] * 100) : String(S[varName]);
    if (el.textContent.trim() !== display) el.textContent = display;
    requestAnimationFrame(() => {
      const r = document.createRange();
      r.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(r);
    });
  }
});

// focusout: save data-var value and update calculations
document.addEventListener('focusout', e => {
  const el = e.target;
  if (!el.classList.contains('var-cell')) return;
  const varName = el.dataset.var;
  if (!varName || S[varName] === undefined) return;
  const raw = el.textContent.trim()
    .replace(/,/g,'').replace(/%/,'')
    .replace(/[^\d.\-]/g,'');
  let num = parseFloat(raw);
  if (!isNaN(num) && isFinite(num)) {
    // 퍼센트 변수: 사용자가 6 입력 → 0.06 저장
    if (PCT_VARS.has(varName)) num = num / 100;
    S[varName] = num;
    updateDisplay();
    // 표시: 퍼센트는 6%, 일반은 숫자
    el.textContent = formatVarDisplay(varName, num);
  } else {
    el.textContent = el.dataset.prevText || formatVarDisplay(varName, S[varName]);
  }
});

// Enter = blur (confirm), Escape = restore and blur
document.addEventListener('keydown', e => {
  const el = document.activeElement;
  if (!el || el.contentEditable !== 'true') return;
  if (e.key === 'Enter') {
    // Allow Shift+Enter for newline in multi-line elements
    const multiline = ['P','DIV'].includes(el.tagName);
    if (!multiline || !e.shiftKey) {
      e.preventDefault();
      el.blur();
    }
  }
  if (e.key === 'Escape') {
    if (el.dataset.prevText !== undefined) {
      el.textContent = el.dataset.prevText;
      delete el.dataset.prevText;
    }
    el.blur();
  }
});

// Paste as plain text only
document.addEventListener('paste', e => {
  const el = document.activeElement;
  if (!el || el.contentEditable !== 'true') return;
  e.preventDefault();
  const txt = (e.clipboardData||window.clipboardData).getData('text/plain');
  document.execCommand('insertText', false, txt.replace(/\n+/g,' ').trim());
});
